[tool.uv.workspace]
members = [
    ".evergreen",
    ".evergreen/auth_aws",
    ".evergreen/auth_oidc",
    ".evergreen/csfle",
    ".evergreen/docker",
    ".evergreen/ocsp",
    ".evergreen/orchestration",
]

[tool.uv.sources]
# .evergreen/orchestration depends on the .evergreen package. Declared here
# rather than in the member's own pyproject because uv cannot resolve a
# workspace source from a member for another member that is its own ancestor
# directory.
drivers-evergreen-tools = { workspace = true }

[dependency-groups]
# Shared boto3 constraint, extended by per-folder groups with
# {include-group = "boto"}.
boto = ["boto3>=1.35.0"]
# boto3 for the AWS credential flows (assume-role, instance-profile assignment,
# container testing), pymongo[aws] for aws_tester.py and the EKS pod self-test, and
# pyop for the OIDC proxy (lib/aws_handle_oidc_creds.py, also imported by auth_oidc).
auth_aws = [
  {include-group = "boto"},
  "pymongo[aws]~=4.0",
  "pyop~=3.4.0",
]
# boto3 for the AWS credential flows, pyop for the OIDC proxy, pyopenssl per
# the legacy requirements, and azure-* for the Key Vault secrets.
#
# pyopenssl is scoped away on s390x (see the csfle group below): no script
# imports it, and every pyopenssl release requires a modern cryptography that
# cannot build there without a Rust toolchain.
auth_oidc = [
  {include-group = "boto"},
  "pyop~=3.4.0",
  "pyopenssl>=23.2.0; platform_machine != 's390x'",
  "azure-identity",
  "azure-keyvault-secrets",
]
# boto3 for .evergreen/docker/login.py's ECR token flow.
docker = [{include-group = "boto"}]
# asn1crypto for the mock OCSP responder's ASN.1 certificate handling
# (mock_ocsp_responder.py), cryptography for private key loading and OCSP
# response signing, flask for its HTTP interface, and waitress for WSGI
# serving (ocsp_mock.py).
#
# cryptography is forked on s390x to the Rust-free releases (see the csfle
# group below): uv locks all groups together, so every group's cryptography
# requirement must agree per platform.
ocsp = [
  "asn1crypto~=1.5.1",
  "cryptography>=42; platform_machine != 's390x'",
  "cryptography<3.4; platform_machine == 's390x'",
  "flask~=3.1.3",
  "waitress~=3.0.2",
]
# boto3 for the secrets handling (setup_secrets.py), pykmip (the MongoDB fork)
# for the mock KMIP server and client, and cryptography for the KMS HTTP
# servers' TLS and key handling. bottle is vendored as .evergreen/csfle/bottle.py.
#
# On s390x (zSeries) cryptography publishes no wheels, and building a modern
# release requires a Rust toolchain. The s390x fork pins the last Rust-free
# releases (cryptography<3.4, sqlalchemy<2.0 per pykmip's unique_identifier
# mapper error), preserving the fallback the deleted requirements-legacy.txt
# provided to the legacy venv workflow.
csfle = [
  {include-group = "boto"},
  "pykmip @ git+https://github.com/mongodb-forks/PyKMIP.git",
  "cryptography>=45.0.0; platform_machine != 's390x'",
  "cryptography<3.4; platform_machine == 's390x'",
  "sqlalchemy<2.0; platform_machine == 's390x'",
]

[tool.uv]
exclude-newer = "1 week"

# Fail fast rather than building pydantic-core from source when no wheel
# exists for the interpreter (DRIVERS-3649).
no-build-package = ["pydantic-core"]

required-environments = [
    "platform_system == 'Linux' and platform_machine == 'x86_64'",
    "platform_system == 'Linux' and platform_machine == 'aarch64'",
    "platform_system == 'Linux' and platform_machine == 'ppc64le'",
    "platform_system == 'Linux' and platform_machine == 's390x'",

    "platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "platform_system == 'Darwin' and platform_machine == 'arm64'",

    "platform_system == 'Windows' and platform_machine == 'AMD64'",
]
