[tool.uv.workspace]
members = [
    ".evergreen",
    ".evergreen/auth_aws",
    ".evergreen/auth_oidc",
    ".evergreen/docker",
    ".evergreen/orchestration",
]

[tool.uv.sources]
# .evergreen/orchestration depends on the .evergreen package. Declared here
# rather than in the member's own pyproject because uv cannot resolve a
# workspace source from a member for another member that is its own ancestor
# directory.
drivers-evergreen-tools = { workspace = true }

[dependency-groups]
# Shared boto3 constraint for the tool folders that need AWS access
# (csfle): follow-up DRIVERS-3564 migrations
# will add the per-folder groups that extend this one with
# {include-group = "boto"}.
boto = ["boto3>=1.35.0"]
# boto3 for the AWS credential flows (assume-role, instance-profile assignment,
# container testing), pymongo[aws] for aws_tester.py and the EKS pod self-test, and
# pyop for the OIDC proxy (lib/aws_handle_oidc_creds.py, also imported by auth_oidc).
auth_aws = [
  {include-group = "boto"},
  "pymongo[aws]~=4.0",
  "pyop~=3.4.0",
]
# boto3 for utils.py's vault access and the AWS credential flows, pyop for
# aws_handle_oidc_creds.py (imported from auth_aws/lib by utils.py), pyopenssl
# per the legacy requirements, and azure-* for the Azure Key Vault secret
# handling (azure/handle_secrets.py).
auth_oidc = [
  {include-group = "boto"},
  "pyop~=3.4.0",
  "pyopenssl>=23.2.0",
  "azure-identity",
  "azure-keyvault-secrets",
]
# boto3 for .evergreen/docker/login.py's ECR token flow.
docker = [{include-group = "boto"}]

[tool.uv]
exclude-newer = "1 week"

# Fail fast rather than building pydantic-core from source when it has no
# wheel for the host interpreter (e.g. CPython 3.14, DRIVERS-3649). Replaces
# the --only-binary=pydantic-core pin from the legacy per-folder
# requirements-in.txt files. pyop (pulled in by both auth_aws and auth_oidc)
# depends on pydantic, so this applies workspace-wide.
no-build-package = ["pydantic-core"]

required-environments = [
    "platform_system == 'Linux' and platform_machine == 'x86_64'",
    "platform_system == 'Linux' and platform_machine == 'aarch64'",
    "platform_system == 'Linux' and platform_machine == 'ppc64le'",
    "platform_system == 'Linux' and platform_machine == 's390x'",

    "platform_system == 'Darwin' and platform_machine == 'x86_64'",
    "platform_system == 'Darwin' and platform_machine == 'arm64'",

    "platform_system == 'Windows' and platform_machine == 'AMD64'",
]
