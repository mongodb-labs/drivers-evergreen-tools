version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  # Python (uv workspace root). Routine version updates come from the
  # uv-lock-update workflow; security updates are exempt from the 0 limit.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  # Go modules (mongoproxy and perfcomp), updated together in one PR.
  - package-ecosystem: "gomod"
    directories:
      - "/.evergreen/mongoproxy"
      - "/.evergreen/perfcomp"
    schedule:
      interval: "weekly"
    groups:
      gomod:
        patterns:
          - "*"
  # github_app (Node).
  - package-ecosystem: "npm"
    directory: "/.evergreen/github_app"
    schedule:
      interval: "weekly"
    groups:
      github-app:
        patterns:
          - "*"
  # mongodb-runner pins. See .evergreen/orchestration/mongodb-runner/README.md.
  - package-ecosystem: "npm"
    directory: "/.evergreen/orchestration/mongodb-runner/default"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    groups:
      mongodb-runner:
        patterns:
          - "*"
  # Azure Functions app is inactive (DRIVERS-2883). Add a "pip" entry for
  # .evergreen/auth_oidc/azure_func/self-test if it becomes active.
