version: 2
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"
  # Python (uv workspace root: pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python:
        patterns:
          - "*"
  # mongodb-runner pins. See .evergreen/orchestration/mongodb-runner/README.md.
  - package-ecosystem: "npm"
    directory: "/.evergreen/orchestration/mongodb-runner/default"
    schedule:
      interval: "weekly"
    allow:
      - dependency-type: "all"
    groups:
      mongodb-runner:
        patterns:
          - "*"
