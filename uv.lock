version = 1
revision = 3
requires-python = ">=3.9"
resolution-markers = [
    "python_full_version >= '3.10' and platform_machine == 's390x'",
    "python_full_version >= '3.10' and platform_machine != 's390x'",
    "python_full_version > '3.9' and python_full_version < '3.10' and platform_machine == 's390x'",
    "python_full_version > '3.9' and python_full_version < '3.10' and platform_machine != 's390x'",
    "python_full_version <= '3.9' and platform_machine == 's390x'",
    "python_full_version <= '3.9' and platform_machine != 's390x'",
]
required-markers = [
    "platform_machine == 'x86_64' and sys_platform == 'linux'",
    "platform_machine == 'aarch64' and sys_platform == 'linux'",
    "platform_machine == 'ppc64le' and sys_platform == 'linux'",
    "platform_machine == 's390x' and sys_platform == 'linux'",
    "platform_machine == 'x86_64' and sys_platform == 'darwin'",
    "platform_machine == 'arm64' and sys_platform == 'darwin'",
    "platform_machine == 'AMD64' and sys_platform == 'win32'",
]

[options]
exclude-newer = "0001-01-01T00:00:00Z" # This has no effect and is included for backwards compatibility when using relative exclude-newer values.
exclude-newer-span = "P1W"

[manifest]
members = [
    "drivers-auth-aws",
    "drivers-auth-oidc",
    "drivers-csfle",
    "drivers-docker",
    "drivers-evergreen-tools",
    "drivers-ocsp",
    "drivers-orchestration",
]

[manifest.dependency-groups]
auth-aws = [
    { name = "boto3", specifier = ">=1.35.0" },
    { name = "pymongo", extras = ["aws"], specifier = "~=4.0" },
    { name = "pyop", specifier = "~=3.4.0" },
]
auth-oidc = [
    { name = "azure-identity" },
    { name = "azure-keyvault-secrets" },
    { name = "boto3", specifier = ">=1.35.0" },
    { name = "pyop", specifier = "~=3.4.0" },
]
boto = [{ name = "boto3", specifier = ">=1.35.0" }]
csfle = [
    { name = "boto3", specifier = ">=1.35.0" },
    { name = "cryptography", marker = "platform_machine != 's390x'", specifier = ">=45.0.0" },
    { name = "cryptography", marker = "platform_machine == 's390x'", specifier = "<3.4" },
    { name = "pykmip", specifier = "~=0.11.0" },
    { name = "sqlalchemy", marker = "platform_machine == 's390x'", specifier = "<2.0" },
]
docker = [{ name = "boto3", specifier = ">=1.35.0" }]
ocsp = [
    { name = "asn1crypto", specifier = "~=1.5.1" },
    { name = "cryptography", marker = "platform_machine != 's390x'", specifier = ">=42" },
    { name = "cryptography", marker = "platform_machine == 's390x'", specifier = "<3.4" },
    { name = "flask", specifier = "~=3.1.3" },
    { name = "waitress", specifier = "~=3.0.2" },
]

