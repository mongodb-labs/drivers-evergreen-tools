[build-system]
requires = [
    # Prevent https://github.com/mongodb-labs/drivers-evergreen-tools/pull/893: hatchling 1.28 requires Python 3.10+.
    "hatchling==1.27.0; python_version < '3.10'",
    "hatchling==1.32.4; python_version >= '3.10'",
]
build-backend = "hatchling.build"

[project]
name = "drivers-orchestration"
version = "0.1.0"
description = 'Scripts for drivers orchestration'
requires-python = ">=3.9"
license = "MIT"
keywords = []
authors = [
  { name = "Steven Silvester", email = "steve.silvester@mongodb.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "drivers-evergreen-tools",
  "mongo-orchestration>=0.11.2",
  "psutil>=7.1"
]

[project.scripts]
drivers-orchestration = "drivers_orchestration:main"

[tool.hatch.build]
include = ["drivers_orchestration.py", "mongodb_runner.py", "otel.py"]
